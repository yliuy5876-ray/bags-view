<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYINER BAG CATALOG</title>
    <style>
        /* === 全局样式 - 亮黄朋克风 === */
        :root {
            --bg-color: #fff74e;
            --text-color: #000000;
            --accent-color: #ff4da6;
            --border-style: 3px solid #000;
            --card-bg: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        h1, h2, h3, h4 { text-transform: uppercase; font-weight: 900; }
        .container { max-width: 1200px; margin: 0 auto; }

        /* === 顶部导航栏 === */
        header {
            border: var(--border-style);
            background: #000;
            color: #fff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        header h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 3px;
            cursor: pointer;
        }
        .admin-btn {
            background: var(--accent-color);
            color: #fff;
            border: 2px solid #fff;
            padding: 6px 18px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .admin-btn:hover { background: #ff1a8a; }

        /* === 面包屑 === */
        .breadcrumbs {
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: var(--border-style);
            padding-bottom: 10px;
            display: inline-block;
            width: 100%;
        }
        .breadcrumbs span { cursor: pointer; }
        .breadcrumbs span:hover { text-decoration: underline; }

        /* === 页面视图切换 === */
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === 首页：分类目录 === */
        .category-banner {
            background: #000; color: #fff; padding: 12px 20px;
            margin-bottom: 25px; font-weight: bold; font-size: 0.95rem;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }
        .category-card {
            background: var(--card-bg);
            border: var(--border-style);
            padding: 50px 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 8px 8px 0px #000;
        }
        .category-card:hover {
            transform: translate(-5px, -5px);
            box-shadow: 13px 13px 0px #000;
        }
        .category-card .cat-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .category-card h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .category-card .cat-count {
            font-size: 0.85rem; color: #666; font-weight: normal;
        }

        /* === 列表页：产品网格 === */
        .back-btn {
            background: #000; color: #fff; border: none;
            padding: 8px 20px; font-weight: bold; cursor: pointer;
            margin-bottom: 20px; font-family: inherit;
            text-transform: uppercase; font-size: 0.85rem;
        }
        .back-btn:hover { background: var(--accent-color); }
        .list-title {
            margin-bottom: 25px; font-size: 2.2rem;
            border-bottom: 4px solid var(--accent-color);
            display: inline-block;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: var(--card-bg);
            border: var(--border-style);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 5px 5px 0px #000;
        }
        .product-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px #000;
        }
        /* 悬停切换图片容器 */
        .image-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #f0f0f0;
            border-bottom: var(--border-style);
            overflow: hidden;
        }
        .image-wrapper img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease-in-out;
        }
        .img-default { opacity: 1; z-index: 1; }
        .img-hover { opacity: 0; z-index: 2; }
        .image-wrapper:hover .img-hover { opacity: 1; }

        .product-info { padding: 15px 20px; }
        .tag {
            background: var(--accent-color); color: white;
            padding: 2px 10px; font-size: 0.75rem;
            font-weight: bold; display: inline-block;
            margin-bottom: 8px; text-transform: uppercase;
        }
        .product-info h3 {
            font-size: 1.1rem; margin-bottom: 6px; line-height: 1.3;
        }
        .product-info .product-material {
            font-size: 0.85rem; color: #555; margin-bottom: 4px;
        }
        .product-info .product-price {
            font-size: 1.2rem; font-weight: 900; margin-top: 8px;
        }

        /* === 详情页 === */
        .detail-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            background: var(--card-bg);
            border: var(--border-style);
            padding: 40px;
            box-shadow: 10px 10px 0px #000;
        }
        .detail-gallery { display: flex; flex-direction: column; gap: 15px; }
        .main-image {
            width: 100%; height: 450px;
            background: #f5f5f5; border: 2px solid #000;
            overflow: hidden; position: relative;
        }
        .main-image img {
            width: 100%; height: 100%;
            object-fit: contain;
            transition: opacity 0.4s ease-in-out;
        }
        .main-image .img-default { opacity: 1; z-index: 1; }
        .main-image .img-hover { opacity: 0; z-index: 2; }
        .main-image:hover .img-hover { opacity: 1; }
        .thumbnails { display: flex; gap: 10px; }
        .thumb {
            width: 80px; height: 80px; border: 2px solid #000;
            background: #eee; cursor: pointer; overflow: hidden;
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .thumb.active { border-color: var(--accent-color); }

        .detail-info h2 {
            font-size: 2.5rem; margin-bottom: 10px;
            border-bottom: 4px solid var(--accent-color);
            display: inline-block;
        }
        .detail-info .detail-desc {
            font-size: 1.1rem; line-height: 1.8; margin: 20px 0;
        }
        .specs-table {
            width: 100%; border-collapse: collapse;
            margin: 25px 0; border: 2px solid #000;
        }
        .specs-table td {
            border: 1px solid #000; padding: 12px 15px;
            font-weight: bold; font-size: 0.95rem;
        }
        .specs-table td:first-child {
            background: #f0f0f0; width: 35%;
        }
        .detail-actions { margin-top: 30px; display: flex; gap: 15px; }
        .action-btn {
            background: var(--accent-color); color: #fff;
            border: 2px solid #000; padding: 12px 30px;
            font-weight: bold; cursor: pointer;
            text-transform: uppercase; font-size: 0.9rem;
            font-family: inherit;
        }
        .action-btn:hover { background: #ff1a8a; }
        .action-btn.secondary { background: #000; }
        .action-btn.secondary:hover { background: #333; }

        /* === 管理员登录 === */
        .login-box {
            background: #fff; border: var(--border-style);
            padding: 50px; max-width: 420px;
            margin: 60px auto; box-shadow: 10px 10px 0px #000;
            text-align: center;
        }
        .login-box h2 { margin-bottom: 25px; font-size: 1.8rem; }
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 2px solid #000; font-family: inherit;
            font-size: 1rem;
        }
        .login-box button {
            width: 100%; padding: 12px; margin-top: 15px;
            background: #000; color: #fff; border: none;
            font-weight: bold; cursor: pointer;
            text-transform: uppercase; font-size: 1rem;
            font-family: inherit;
        }
        .login-box button:hover { background: var(--accent-color); }
        .login-msg { color: red; margin-top: 15px; font-weight: bold; }

        /* === 管理员后台 === */
        .admin-panel {
            background: #fff; border: var(--border-style);
            padding: 40px; max-width: 700px;
            margin: 30px auto; box-shadow: 10px 10px 0px #000;
        }
        .admin-panel h2 { margin-bottom: 25px; font-size: 1.8rem; }
        .admin-panel label {
            display: block; margin-top: 15px;
            font-weight: bold; margin-bottom: 5px;
        }
        .admin-panel input, .admin-panel select, .admin-panel textarea {
            width: 100%; padding: 10px; border: 2px solid #000;
            font-family: inherit; font-size: 0.95rem;
        }
        .admin-panel textarea { height: 80px; resize: vertical; }
        .admin-panel button {
            width: 100%; padding: 12px; margin-top: 20px;
            background: #000; color: #fff; border: none;
            font-weight: bold; cursor: pointer;
            text-transform: uppercase; font-size: 1rem;
            font-family: inherit;
        }
        .admin-panel button:hover { background: var(--accent-color); }
        .admin-panel .exit-btn {
            background: #666; margin-top: 10px;
        }
        .admin-panel .exit-btn:hover { background: #333; }

        /* 产品管理列表 */
        .admin-product-list { margin-top: 40px; border-top: 2px solid #000; padding-top: 20px; }
        .admin-product-item {
            display: flex; justify-content: space-between;
            align-items: center; padding: 12px;
            border: 1px solid #ccc; margin-bottom: 8px;
        }
        .admin-product-item .item-info { flex: 1; }
        .admin-product-item .item-name { font-weight: bold; }
        .admin-product-item .item-cat { font-size: 0.85rem; color: #666; }
        .delete-btn {
            background: #ff3333; color: #fff; border: 2px solid #000;
            padding: 6px 15px; cursor: pointer; font-weight: bold;
            font-family: inherit;
        }
        .delete-btn:hover { background: #cc0000; }

        /* === 页脚 === */
        footer {
            text-align: center; padding: 40px 0 20px;
            margin-top: 60px; font-size: 0.85rem;
            border-top: 2px solid #000;
        }

        /* === 响应式 === */
        @media (max-width: 768px) {
            .detail-layout { grid-template-columns: 1fr; }
            .main-image { height: 350px; }
            header { flex-direction: column; gap: 10px; }
        }

        /* === 空状态 === */
        .empty-state {
            text-align: center; padding: 60px 20px;
            font-size: 1.2rem; color: #666;
        }
    </style>
</head>

function getProducts() {
    const stored = localStorage.getItem('rayiner_products');
    if (stored) {
        return JSON.parse(stored);
    }
    localStorage.setItem('rayiner_products', JSON.stringify(defaultProducts));
    return defaultProducts;
}

function saveProducts(products) {
    localStorage.setItem('rayiner_products', JSON.stringify(products));
}

function addProduct(item) {
    const products = getProducts();
    item.id = Date.now();
    products.push(item);
    saveProducts(products);
}

function deleteProduct(id) {
    let products = getProducts();
    products = products.filter(p => p.id != id);
    saveProducts(products);
}

// === 页面导航 ===
function switchView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => {
        el.classList.remove('active');
    });
    document.getElementById(viewId).classList.add('active');

    const breadcrumbs = document.getElementById('breadcrumbs');
    if (viewId === 'view-home') {
        breadcrumbs.style.display = 'none';
    } else {
        breadcrumbs.style.display = 'block';
    }

    window.scrollTo(0, 0);
}

function goHome() {
    renderCategories();
    switchView('view-home');
}

function showLogin() {
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('login-msg').innerText = '';
    switchView('view-login');
}

function goBackToList() {
    renderCategories();
    switchView('view-home');
}

// === 渲染首页分类 ===
function renderCategories() {
    const products = getProducts();
    const container = document.getElementById('category-container');
    container.innerHTML = '';

    categories.forEach(cat => {
        const count = products.filter(p => p.catId === cat.id).length;
        const div = document.createElement('div');
        div.className = 'category-card';
        div.onclick = () => showCategory(cat.id);
        div.innerHTML = `
            <div class="cat-icon">${cat.icon}</div>
            <h2>${cat.name}</h2>
            <div class="cat-count">${count} 件产品</div>
        `;
        container.appendChild(div);
    });
}

// === 渲染列表页 ===
function showCategory(catId) {
    const cat = categories.find(c => c.id === catId);
    const products = getProducts().filter(p => p.catId === catId);

    document.getElementById('list-title').innerText = cat.name + ' / ' + catId.toUpperCase();
    document.getElementById('current-path').innerText = cat.name;

    const container = document.getElementById('product-container');
    container.innerHTML = '';

    if (products.length === 0) {
        document.getElementById('empty-list').style.display = 'block';
    } else {
        document.getElementById('empty-list').style.display = 'none';
        products.forEach(product => {
            const card = createProductCard(product);
            container.appendChild(card);
        });
    }

    switchView('view-list');
}

function createProductCard(product) {
    const div = document.createElement('div');
    div.className = 'product-card';
    div.onclick = () => showDetail(product.id);
    div.innerHTML = `
        <div class="image-wrapper">
            <img class="img-default" src="${product.img1 || 'https://via.placeholder.com/400x500?text=NO+IMAGE'}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/400x500?text=NO+IMAGE'">
            <img class="img-hover" src="${product.img2 || product.img1 || 'https://via.placeholder.com/400x500?text=NO+IMAGE'}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/400x500?text=NO+IMAGE'">
        </div>
        <div class="product-info">
            <span class="tag">${product.tag || 'NEW'}</span>
            <h3>${product.name}</h3>
            <div class="product-material">${product.material}</div>
            <div class="product-price">${product.price}</div>
        </div>
    `;
    return div;
}

// === 渲染详情页 ===
function showDetail(productId) {
    const products = getProducts();
    const product = products.find(p => p.id == productId);
    if (!product) {
        alert('产品不存在');
        return;
    }

    document.getElementById('current-path').innerText = product.name;

    const cat = categories.find(c => c.id === product.catId);
    const catName = cat ? cat.name : product.catId;

    const container = document.getElementById('detail-content');
    container.innerHTML = `
        <div class="detail-gallery">
            <div class="main-image">
                <img class="img-default" src="${product.img1 || 'https://via.placeholder.com/600x750?text=NO+IMAGE'}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/600x750?text=NO+IMAGE'">
                <img class="img-hover" src="${product.img2 || product.img1 || 'https://via.placeholder.com/600x750?text=NO+IMAGE'}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/600x750?text=NO+IMAGE'">
            </div>
            <div class="thumbnails">
                <div class="thumb active"><img src="${product.img1 || 'https://via.placeholder.com/100?text=1'}" alt="thumb1"></div>
                <div class="thumb"><img src="${product.img2 || product.img1 || 'https://via.placeholder.com/100?text=2'}" alt="thumb2"></div>
                <div class="thumb"><img src="https://via.placeholder.com/100?text=3" alt="thumb3"></div>
                <div class="thumb"><img src="https://via.placeholder.com/100?text=4" alt="thumb4"></div>
            </div>
        </div>
        <div class="detail-info">
            <span class="tag">${product.tag || 'NEW ARRIVAL'}</span>
            <h2>${product.name}</h2>
            <div class="product-price" style="font-size:1.5rem; margin:15px 0;">${product.price}</div>
            <p class="detail-desc">${product.desc || '暂无描述'}</p>

            <table class="specs-table">
                <tr><td>材质 Material</td><td>${product.material}</td></tr>
                <tr><td>尺寸 Size</td><td>${product.size || 'N/A'}</td></tr>
                <tr><td>重量 Weight</td><td>${product.weight || 'N/A'}</td></tr>
                <tr><td>设计风格 Style</td><td>${product.style || 'N/A'}</td></tr>
                <tr><td>颜色 Color</td><td>${product.color || 'N/A'}</td></tr>
                <tr><td>分类 Category</td><td>${catName}</td></tr>
            </table>

            <div class="detail-actions">
                <button class="action-btn">CONTACT FOR PRICE</button>
                <button class="action-btn secondary" onclick="goBackToList()">← 返回列表</button>
            </div>
        </div>
    `;

    switchView('view-detail');
}

// === 管理员登录 ===

    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();

    if (user === 'RAYINER' && pass === 'a1532953204+') {
        document.getElementById('login-msg').innerText = '';
        renderAdminProductList();

// === 管理员：渲染产品管理列表 ===
function renderAdminProductList() {
    const products = getProducts();
    const container = document.getElementById('admin-product-list');
    container.innerHTML = '';

    if (products.length === 0) {
        container.innerHTML = '<p style="color:#666; padding:10px;">暂无产品</p>';
        return;
    }

    products.forEach(p => {
        const cat = categories.find(c => c.id === p.catId);
        const catName = cat ? cat.name : p.catId;
        const div = document.createElement('div');
        div.className = 'admin-product-item';
        div.innerHTML = `
            <div class="item-info">
                <div class="item-name">${p.name}</div>
                <div class="item-cat">${catName} | ${p.material} | ${p.price}</div>
            </div>
            <button class="delete-btn" onclick="deleteProductItem(${p.id})">DELETE</button>
        `;
        container.appendChild(div);
    });
}

function deleteProductItem(id) {
    if (confirm('确定要删除这个产品吗？')) {
        deleteProduct(id);
        renderAdminProductList();
    }
}

// === 管理员：添加新产品 ===
function addNewItem() {
    const item = {
        catId: document.getElementById('new-cat').value,
        name: document.getElementById('new-name').value.trim(),
        material: document.getElementById('new-material').value.trim(),
        price: document.getElementById('new-price').value.trim(),
        desc: document.getElementById('new-desc').value.trim(),
        size: document.getElementById('new-size').value.trim(),
        style: document.getElementById('new-style').value.trim(),
        color: document.getElementById('new-color').value.trim(),
        tag: document.getElementById('new-tag').value.trim() || 'NEW',
        img1: document.getElementById('new-img1').value.trim() || 'https://via.placeholder.com/400x500?text=NO+IMAGE',
        img2: document.getElementById('new-img2').value.trim() || ''
    };

    if (!item.name) {
        alert('请输入产品名称！');
        return;
    }

    addProduct(item);

    // 清空表单
    document.getElementById('new-name').value = '';
    document.getElementById('new-material').value = '';
    document.getElementById('new-price').value = '';
    document.getElementById('new-desc').value = '';
    document.getElementById('new-size').value = '';
    document.getElementById('new-style').value = '';
    document.getElementById('new-color').value = '';
    document.getElementById('new-tag').value = '';
    document.getElementById('new-img1').value = '';
    document.getElementById('new-img2').value = '';

    renderAdminProductList();
    alert('产品添加成功！Product added successfully.');
}

// === 初始化 ===
window.onload = function() {
    renderCategories();
};

// 回车键登录
document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && document.getElementById('view-login').classList.contains('active')) {
        checkLogin();
    }
});
